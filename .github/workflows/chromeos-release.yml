name: ChromeOS Linux 패키지

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  deb:
    name: "Crostini .deb (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 버전 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Qt 실행 의존성 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libfontconfig1 libxkbcommon0 \
            libdbus-1-3 desktop-file-utils

      - name: 빌드 의존성 설치
        run: |
          python -m pip install --upgrade pip
          # PyQt6 최신 ARM wheel은 glibc 2.39+만 제공하므로 Debian 12용 버전으로 고정.
          python -m pip install 'PyQt6==6.7.1' 'PyQt6-Qt6==6.7.3'
          python -m pip install . pyinstaller==6.22.3

      - name: 실행 파일 빌드
        run: |
          python -m PyInstaller --clean --noconfirm --onedir \
            --name chromeos-printer-supporter \
            --paths src --collect-all pymupdf \
            src/printer_supporter/entrypoint.py

      - name: 실행 파일 자체 검사
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/chromeos-printer-supporter/chromeos-printer-supporter --version
          dist/chromeos-printer-supporter/chromeos-printer-supporter --smoke-test

      - name: Debian 설치 파일 만들기
        run: |
          python scripts/build_deb.py --arch "${{ matrix.arch }}"
          dpkg-deb --info dist/deb/*.deb
          desktop-file-validate packaging/chromeos-printer-supporter.desktop
          (cd dist/deb && sha256sum -c *.sha256)

      - name: 설치 후 런처 검사
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/deb/*.deb
          test -x /usr/bin/chromeos-printer-supporter
          test -f /usr/share/applications/chromeos-printer-supporter.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/chromeos-printer-supporter.svg
          /usr/bin/chromeos-printer-supporter --smoke-test
          dpkg-query -W -f='${Status}' chromeos-printer-supporter | grep -q 'install ok installed'

      - uses: actions/upload-artifact@v4
        with:
          name: chromeos-printer-supporter-${{ matrix.arch }}
          path: |
            dist/deb/*.deb
            dist/deb/*.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: GitHub 초안 릴리즈
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chromeos-printer-supporter-*
          path: release
          merge-multiple: true

      - name: 패키지 검사 및 체크섬 생성
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          (cd release && sha256sum -c *.deb.sha256)
          (cd release && sha256sum *.deb > SHA256SUMS)

      - name: 공개 전 검토용 Release 초안 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.deb release/SHA256SUMS \
            --verify-tag --draft --generate-notes \
            --title "ChromeOS Printer Supporter ${GITHUB_REF_NAME}"
