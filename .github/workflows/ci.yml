name: 파이썬 검증

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 테스트 의존성 설치
        run: python -m pip install -e '.[test]'
      - name: 문법 확인
        run: python -m compileall -q src tests
      - name: 단위 테스트
        run: pytest -q
