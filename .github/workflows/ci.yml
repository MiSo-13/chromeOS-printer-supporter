name: 파이썬 검증

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt 오프스크린 테스트 런타임 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libfontconfig1
      - name: 테스트 의존성 설치
        run: python -m pip install -e '.[test]'
      - name: 문법 확인
        run: python -m compileall -q src tests
      - name: 삼성 ULD 압축 내부 필터·PPD 구조 검사 (진단 후 제거)
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,tarfile,re,hashlib
          url="https://downloadcenter.samsung.com/content/DR/201911/20191101152153376/ULDLINUX_V1.00.39.07_01.24.zip"
          with urllib.request.urlopen(url,timeout=40) as resp:
              content=resp.read(24000000)
          assert hashlib.sha256(content).hexdigest()=="cc112359d77793ba8cd645030b365884103bdba0bcc0df8a9dd199328639d74b"
          with zipfile.ZipFile(io.BytesIO(content)) as outer:
              tar_bytes=outer.read("ULDLINUX_V1.00.39.07_01.24/uld-samsung.tar.gz")
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:gz") as inner:
              names=inner.getnames()
              print("FILECOUNT",len(names))
              print("SAMPLE",names[:70])
              matches=[n for n in names if any(p in n.lower() for p in ("m203","x86_64","arm64","aarch64","rastertospl","ppd","filter","libsamsung"))]
              print("MATCH COUNT",len(matches))
              print("MATCHES",matches[:250])
              for n in matches:
                  if n.lower().endswith(".ppd") and "203" in n:
                      member=inner.extractfile(n)
                      if member:
                          raw=member.read(300000).decode("latin-1","replace")
                          lines=[x for x in raw.splitlines() if any(y in x.lower() for y in ("cupsfilter","modelname","nicknamed","raster"))]
                          print("PPD INFO",n,lines[:30])
          PY
      - name: 단위 테스트
        run: pytest -q
