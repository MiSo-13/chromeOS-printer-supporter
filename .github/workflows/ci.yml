name: 파이썬 검증

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt 오프스크린 테스트 런타임 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libfontconfig1
      - name: 테스트 의존성 설치
        run: python -m pip install -e '.[test]'
      - name: 문법 확인
        run: python -m compileall -q src tests
      - name: 삼성 ULD 공식 배포파일 내용·체크섬 검증 (진단 후 제거)
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request,hashlib,zipfile,io
          from urllib.error import HTTPError
          url="https://downloadcenter.samsung.com/content/DR/201911/20191101152153376/ULDLINUX_V1.00.39.07_01.24.zip"
          print("SOURCE:",url)
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=35) as resp:
                  print("status",resp.status,"url",resp.url,"ctype",resp.headers.get("Content-Type"))
                  raw=resp.read(26000000)
              print("bytes",len(raw),"SHA256",hashlib.sha256(raw).hexdigest(),"ZIP",zipfile.is_zipfile(io.BytesIO(raw)))
              if zipfile.is_zipfile(io.BytesIO(raw)):
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      files=[(x.filename,x.file_size) for x in archive.infolist()]
                      print("filecount",len(files))
                      print("interesting", [x for x in files if any(y in x[0].lower() for y in ("m203","x86_64","arm64","aarch64","rastertospl","install.sh","ppd"))][:100])
                      print("samples",files[:80])
          except Exception as e:
              print("ERROR",repr(e))
          PY
      - name: 단위 테스트
        run: pytest -q
