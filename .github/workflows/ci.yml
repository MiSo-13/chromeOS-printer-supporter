name: 파이썬 검증

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt 오프스크린 테스트 런타임 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon0 libfontconfig1
      - name: 테스트 의존성 설치
        run: python -m pip install -e '.[test]'
      - name: 문법 확인
        run: python -m compileall -q src tests
      - name: 삼성 공식 Linux 드라이버 URL 조사 (진단 후 제거)
        continue-on-error: true
        run: |
          python - <<'PY'
          import re, urllib.request, html, json
          sources = [
              "https://www.samsung.com/sec/support/model/SL-M2030W/",
              "https://www.samsungsvc.co.kr/download/view?code=SL-M2030w",
          ]
          for url in sources:
              print("SOURCE:", url)
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=18) as response:
                      raw = response.read(5000000)
                      print("status", response.status, "bytes", len(raw), "final", response.url)
                  doc = html.unescape(raw.decode("utf-8", "replace")).replace("\\/", "/")
                  for key in ("ULDLINUX", "Linux", "downloadcenter.samsung", ".zip"):
                      positions = [m.start() for m in re.finditer(re.escape(key), doc, re.I)]
                      print("key",key,"count",len(positions))
                      for p in positions[:5]:
                          print("snippet:",doc[max(0,p-240):p+350][:600].replace("\\n"," "))
                  urls = re.findall(r'https?://[^"\\s<>]+', doc, flags=re.I)
                  matches = [x for x in urls if "ULDLINUX" in x.upper() or "DOWNLOADCENTER.SAMSUNG.COM" in x.upper()]
                  print("candidate URLs:", matches[:15])
              except Exception as exc:
                  print("error:", type(exc).__name__, str(exc)[:300])
          PY
      - name: 단위 테스트
        run: pytest -q
